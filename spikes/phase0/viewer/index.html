<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Phase 0 Tower Viewer</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0f1420; color: #e8ecf4; font: 13px/1.4 ui-monospace, Menlo, monospace; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #hud { position: fixed; top: 8px; left: 10px; white-space: pre; pointer-events: none; text-shadow: 0 1px 2px #000; }
    #keys { position: fixed; bottom: 8px; left: 10px; opacity: .7; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud"></div>
  <div id="keys">space: pause · . : step · r: restart · ← →: speed</div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
